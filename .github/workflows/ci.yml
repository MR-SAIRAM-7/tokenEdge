name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Ruff
        run: |
          ruff check tokenedge tests scripts
          ruff format --check tokenedge tests scripts
      - name: Mypy
        run: mypy tokenedge
      - name: Tests (unit, leakage, integration, Backtrader parity)
        run: pytest --cov=tokenedge --cov-report=term-missing

  web:
    name: Web (type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t tokenedge:ci .
      - name: Smoke test
        run: |
          docker run -d --name te -p 8000:8000 -e TOKENEDGE_OFFLINE=1 tokenedge:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/api/backtest -H 'Content-Type: application/json' \
            -d '{"symbol":"SPY","strategy":{"name":"sma_crossover"}}' | head -c 300
          docker logs te | tail -20
