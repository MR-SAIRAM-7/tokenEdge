[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenedge"
version = "0.2.0"
description = "AI-powered algorithmic trading research platform: backtesting, SMA baseline vs XGBoost/LSTM, leakage-safe evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "yfinance>=0.2.50",
    "ccxt>=4.3",
    "xgboost>=2.0",
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "onnx>=1.16",
    "ruff>=0.5",
    "mypy>=1.10",
    "backtrader>=1.9.78",
]

[tool.setuptools.packages.find]
include = ["tokenedge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "crosscheck: parity tests against Backtrader (needs backtrader installed)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
exclude = ["tests/", "notebooks/", "web/"]

[tool.coverage.run]
source = ["tokenedge"]
omit = ["tokenedge/compat/*", "tokenedge/ml/lstm_model.py"]
