<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TokenEdge: backtest a moving-average baseline against XGBoost and LSTM strategies on held-out market data." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TokenEdge</title>
    <script>
      try {
        var t = localStorage.getItem("tokenedge.theme");
        if (t === "light") { document.documentElement.classList.remove("dark"); document.documentElement.dataset.theme = "light"; }
        else { document.documentElement.dataset.theme = "dark"; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
