services:
  tokenedge:
    build:
      context: .
    image: tokenedge:latest
    ports:
      - "8000:8000"
    environment:
      # Set to "1" to never call Yahoo / exchanges (bundled snapshots only), e.g. without Wi-Fi.
      TOKENEDGE_OFFLINE: "0"
      # Run the research study on first start so the findings and run history are filled.
      TOKENEDGE_RUN_STUDY: "1"
    volumes:
      # Drop newly trained model folders into ./models without rebuilding the image.
      - ./models:/app/models:ro
      - tokenedge-var:/app/var
    restart: unless-stopped

volumes:
  tokenedge-var:
